# ApplicationSet — cloudflared on every role=control cluster (mgmt-control).
# Pattern B: the tunnel is a single north-south entry point; it does not
# belong on every workload cluster. VLANs are inter-routed via pfSense, so
# one cloudflared on mgmt-control reaches every cluster's ingress VIP
# (10.10.2.200 / 10.10.3.201 / 10.10.5.201).
#
# Prerequisites (Synced+Healthy first):
#   - ingress-nginx        (the VIPs cloudflared proxies to)
#   - external-secrets     (ClusterSecretStore vault-forge; Vault must hold
#                           kv/forge/cloudflared/tunnel — see
#                           networking/cloudflared/README.md §4)
#   - cert-manager         (origin certs cloudflared validates via caPool)
#
# Also required before the tunnel carries traffic (owner: you, dashboard):
#   - tunnel `homelab` created; .Values.tunnel.id set in
#     networking/cloudflared/values.yaml
#   - 6 Tier-1 proxied CNAMEs -> <id>.cfargotunnel.com
#   - Cloudflare Access app per hostname (Google zdozisik@gmail.com only)
#   - WARP route 10.10.0.0/16 for Tier-2
#
# Discovery: picked up by the sre-root App-of-Apps (sre-root-app.yaml) — no
# kubectl apply needed once the root is bootstrapped.

apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cloudflared
  namespace: argocd-sre
spec:
  generators:
    - clusters:
        selector:
          matchLabels:
            role: control
  template:
    metadata:
      name: 'cloudflared-{{name}}'
      labels:
        app.kubernetes.io/name: cloudflared
        app.kubernetes.io/part-of: platform
      annotations:
        # After ingress-nginx (0), ESO ClusterSecretStore (2), oauth2-proxy
        # (3) and Homer (4) — the tunnel comes up last, once there is
        # something healthy behind every VIP.
        argocd.argoproj.io/sync-wave: "5"
    spec:
      project: default
      source:
        repoURL: https://github.com/GaddipatiSriram/cplanes.git
        targetRevision: HEAD
        path: networking/cloudflared
        helm:
          releaseName: cloudflared
      destination:
        server: '{{server}}'
        namespace: cloudflared
      # ESO admission injects defaults (conversionStrategy/decodingStrategy/
      # metadataPolicy on data; engineVersion/mergePolicy on target.template)
      # that aren't in the chart source — suppress to keep the App Synced.
      ignoreDifferences:
        - group: external-secrets.io
          kind: ExternalSecret
          jsonPointers:
            - /spec/data
            - /spec/target/template/engineVersion
            - /spec/target/template/mergePolicy
      syncPolicy:
        automated:
          selfHeal: true
          prune: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true
          - RespectIgnoreDifferences=true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
