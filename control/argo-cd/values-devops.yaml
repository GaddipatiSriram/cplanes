        clientID: argocd-devops
        clientSecret: $argocd-oidc:client-secret
        requestedScopes:
          - openid
          - profile
          - email
          - groups
        requestedIDTokenClaims:
          groups:
            essential: true
    rbac:
      # Devops users get admin on app workloads; SREs are read-only here
      # (their place is argocd-sre).
      policy.default: role:readonly
      policy.csv: |
        g, platform-users, role:admin
      scopes: "[groups]"

  server:
    replicas: 1
    ingress:
      enabled: true
      ingressClassName: nginx
      annotations:
        cert-manager.io/cluster-issuer: vault-pki
        nginx.ingress.kubernetes.io/backend-protocol: HTTP
      hostname: argocd-devops.apps.mgmt-control.engatwork.com
      tls: true

  controller:
    replicas: 1

  repoServer:
    replicas: 1

  applicationSet:
    enabled: true
    replicas: 1

  notifications:
    enabled: false

  redis-ha:
    enabled: false
  redis:
    enabled: true

  dex:
    enabled: false

# Umbrella-chart toggles. Read by templates/oidc-externalsecret.yaml.
oidc:
  enabled: true
  clientName: argocd-devops
