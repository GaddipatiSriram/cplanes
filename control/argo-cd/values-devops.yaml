# Values for the argocd-devops instance — application GitOps controller.
# Subchart name: `argo-cd` — must match Chart.yaml dependency.
#
# Architecture:
#   - Co-resident with argocd-sre on mgmt-control, separate namespace
#     (`argocd-devops`). Same chart, different values — two namespaces
#     gives clean separation between platform GitOps (SRE) and app
#     GitOps (DevOps team).
#   - Cluster-scoped install (same fix as values-sre.yaml).
#   - UI at https://argocd-devops.apps.mgmt-control.engatwork.com

argo-cd:
  # CRDs (Application, ApplicationSet, AppProject) are cluster-scoped
  # singletons — argocd-sre's release already owns them. Disable here so
  # the two ArgoCD instances can coexist on one cluster without helm
  # ownership conflicts.
  crds:
    install: false
    keep: false

  global:
    domain: argocd-devops.apps.mgmt-control.engatwork.com

  configs:
    params:
      server.insecure: true
    cm:
      application.instanceLabelKey: argocd.argoproj.io/instance
      timeout.reconciliation: 180s
      # OIDC against the engatwork Keycloak realm — separate client from
      # argocd-sre so the two instances have distinct identities. Group
      # claim drives RBAC mapping below.
      url: https://argocd-devops.apps.mgmt-control.engatwork.com
      oidc.config: |
        name: Keycloak
        issuer: https://keycloak.apps.mgmt-forge.engatwork.com/auth/realms/engatwork
        # argocd-server reaches this issuer over split-horizon DNS — the internal
        # A record points at the mgmt-forge ingress VIP (10.10.5.201), which
        # serves the keycloak-tls leaf signed by the engatwork.com Root CA (not
        # a public CA, and no Cloudflare edge hop). Pin the root here or OIDC
        # discovery fails with x509: certificate signed by unknown authority.
        # Same PEM as networking/cloudflared + security/ca-pki caBundles.
        rootCA: |
          -----BEGIN CERTIFICATE-----
          MIIFMTCCAxmgAwIBAgIUb/irHt72XajogGWAm+OI63lKxMcwDQYJKoZIhvcNAQEL
          BQAwIDEeMBwGA1UEAxMVZW5nYXR3b3JrLmNvbSBSb290IENBMB4XDTI2MDQyNTIy
          MDMwOVoXDTM2MDQyMjIyMDMzMFowIDEeMBwGA1UEAxMVZW5nYXR3b3JrLmNvbSBS
