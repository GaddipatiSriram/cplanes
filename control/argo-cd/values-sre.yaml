        clientID: argocd-sre
        clientSecret: $argocd-oidc:client-secret
        requestedScopes:
          - openid
          - profile
          - email
          - groups
        requestedIDTokenClaims:
          groups:
            essential: true

    rbac:
      # Default policy: read-only for authenticated users; map the platform-sre
      # Keycloak group to ArgoCD admin so SREs can sync/rollback.
      policy.default: role:readonly
      policy.csv: |
        g, platform-sre, role:admin
      scopes: "[groups]"

  # Server: single replica + ingress (cert-manager-issued cert via
  # ingress-nginx). HA can flip controller/repoServer/applicationSet
  # replicas to 2+ later.
  server:
    replicas: 1
    ingress:
      enabled: true
      ingressClassName: nginx
      annotations:
        cert-manager.io/cluster-issuer: vault-pki
        nginx.ingress.kubernetes.io/backend-protocol: HTTP
      hostname: argocd-sre.apps.mgmt-control.engatwork.com
      tls: true

  controller:
    replicas: 1

  repoServer:
    replicas: 1

  applicationSet:
    enabled: true
    replicas: 1

  notifications:
    enabled: false   # wire to Slack/email after Vault-backed creds land

  # Redis-HA off; single redis is fine for this scale.
  redis-ha:
    enabled: false
  redis:
    enabled: true

  # Dex disabled — OIDC is Keycloak direct via configs.cm.oidc.config above.
  dex:
    enabled: false

# Umbrella-chart toggles (not passed to subchart). Read by
# templates/oidc-externalsecret.yaml.
oidc:
  enabled: true
  clientName: argocd-sre
