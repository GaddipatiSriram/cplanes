# Values for the argocd-sre instance — platform GitOps controller.
# Subchart name: `argo-cd` — must match Chart.yaml dependency.
#
# Architecture:
#   - Cluster-scoped install: argocd-sre manages CRDs, ClusterRoles, and
#     arbitrary namespaces across the entire homelab (mgmt-control,
#     mgmt-workload, mgmt-storage, mgmt-forge, mgmt-observ, future EKS).
#   - Vanilla helm default IS cluster-scoped; we just keep it that way.
#   - UI at https://argocd-sre.apps.mgmt-control.engatwork.com
#   - cert-manager + ingress-nginx (Pattern A baseline on mgmt-control)
#   - HA disabled initially (single replica per component) — flip when
#     load justifies it; mgmt-control is durable but low-traffic.

argo-cd:
  global:
    domain: argocd-sre.apps.mgmt-control.engatwork.com

  configs:
    params:
      # Required when ingress terminates TLS and the server runs HTTP-only.
      server.insecure: true

    cm:
      # ApplicationSet templating uses Go templates; ensure exec env is
      # available for the cluster generator.
      application.instanceLabelKey: argocd.argoproj.io/instance
      # Allow Applications in any namespace to reference repos registered
      # with this controller.
      timeout.reconciliation: 180s
      # Grant the local admin account the `apiKey` capability so
      # `argocd account generate-token --account admin` works. The default
      # admin account has only `login` capability — fine for UI use but
      # blocks API tokens, which Harness needs for its bearer-auth flow
      # against /api/v1/applications/*. Added 2026-05-13 after manually
      # patching argocd-cm to get the Harness Delegate integration unblocked;
      # this entry persists the change so the next ArgoCD reconcile doesn't
      # revert it.
      accounts.admin: "apiKey, login"
      # OIDC against the engatwork Keycloak realm. clientSecret reference
      # `$argocd-oidc:client-secret` is resolved by argocd-server from
      # Secret/argocd-oidc in this namespace (rendered by ESO via
      # templates/oidc-externalsecret.yaml).
      url: https://argocd-sre.apps.mgmt-control.engatwork.com
      oidc.config: |
        name: Keycloak
        issuer: https://keycloak.apps.mgmt-forge.engatwork.com/auth/realms/engatwork
        # argocd-server reaches this issuer over split-horizon DNS — the internal
        # A record points at the mgmt-forge ingress VIP (10.10.5.201), which
        # serves the keycloak-tls leaf signed by the engatwork.com Root CA (not
        # a public CA, and no Cloudflare edge hop). Pin the root here or OIDC
        # discovery fails with x509: certificate signed by unknown authority.
        # Same PEM as networking/cloudflared + security/ca-pki caBundles.
        rootCA: |
          -----BEGIN CERTIFICATE-----
          MIIFMTCCAxmgAwIBAgIUb/irHt72XajogGWAm+OI63lKxMcwDQYJKoZIhvcNAQEL
          BQAwIDEeMBwGA1UEAxMVZW5nYXR3b3JrLmNvbSBSb290IENBMB4XDTI2MDQyNTIy
          MDMwOVoXDTM2MDQyMjIyMDMzMFowIDEeMBwGA1UEAxMVZW5nYXR3b3JrLmNvbSBS
          b290IENBMIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAuWgb2PSWkG77
          QT9P2U4Qgc6rGSC5YcfkRiODD1asXhjr+P68dtC8K55Os/FMpcbWjPOE9s2GClyh
          fdABA43qdgC+4tiTZ7DhCMNmOt6CnhnFPa2yE/nh2ugmERSvkt8WzI58rTaizUzg
          m8aHpkgtaJjWgRoVGrkclYu5rbwAkA0aNfgKxIdEbZqPfDb+pyw90cYau24+OKGa
          aFwNFcQiJXEAubhqjXs7ML6MDiwT6sa+LSHQez7DwkVlv08ZeINGyVhdnrrPywf8
          jAI0NHbuOdaxTrBexYGYGiTcRBL693fWNP8EfyMsAejge9U1uTCKtGehDu/MjLb8
          YlaST43hmDazAgylkGSL8Dwxlh6Tmfks9/QMLP3zqVSuU0F0vuMziZqQCjELDVDZ
          TBwPVl+f1LbGCVecDSm/+w0HFTSmr94pQ6tNF7y+g3iTFxCTkBbX+HE8nSLOj9XO
