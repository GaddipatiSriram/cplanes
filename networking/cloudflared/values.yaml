# ---------------------------------------------------------------------------
# Tier-1 public hostnames (README §3). Each entry:
#   - is a proxied CNAME -> <tunnel.id>.cfargotunnel.com (created dashboard-side)
#   - carries a Cloudflare Access app (Google zdozisik@gmail.com only)
#   - maps here to the relevant cluster's ingress-nginx VIP
# Host header == hostname (split-horizon zone), set explicitly so intent is
# clear. Tier-2 services are NOT listed here — they are reached over WARP at
# their normal URLs, no public DNS.
#
# Ingress VIPs (networking/metallb/README.md):
#   mgmt-control       10.10.2.200
#   mgmt-observability 10.10.3.201
#   mgmt-forge         10.10.5.201
ingress:
  - hostname: home.apps.mgmt-control.engatwork.com
    service: https://10.10.2.200
  # Short public shortcut for Homer (1-label -> free Universal SSL at the
  # edge, no ACM). Routed to the same ingress; Host header + SNI are
  # home.engatwork.com, which the Homer + oauth2-proxy ingresses now accept
  # and cert-manager covers in home-tls.
  - hostname: home.engatwork.com
    service: https://10.10.2.200
  - hostname: workflows.apps.mgmt-control.engatwork.com
    service: https://10.10.2.200
  - hostname: backstage.apps.mgmt-control.engatwork.com
    service: https://10.10.2.200
  - hostname: jenkins.apps.mgmt-control.engatwork.com
    service: https://10.10.2.200
  # ArgoCD — promoted from Tier-2 (WARP) to public. Full blast radius (deploys
  # to every cluster), so it MUST sit behind a Cloudflare Access app with an
  # Allow policy (zdozisik@ / sriram.gc432@). SSO callback path /auth/callback
  # is server-side from the browser, no Access bypass needed — the Keycloak
  # OIDC endpoints it hits are on the keycloak hostname, already bypassed there.
  - hostname: argocd-sre.apps.mgmt-control.engatwork.com
    service: https://10.10.2.200
  - hostname: argocd-devops.apps.mgmt-control.engatwork.com
    service: https://10.10.2.200
  - hostname: grafana.apps.mgmt-observability.engatwork.com
    service: https://10.10.3.201
  - hostname: sonarqube.apps.mgmt-forge.engatwork.com
    service: https://10.10.5.201
  # Keycloak — public surface is:
  #   /auth/realms/engatwork/  OIDC endpoints for internet-facing SSO (home.engatwork.com)
  #   /auth/realms/master/     login flow backing the admin console
  #   /auth/admin/             admin console SPA + admin REST API
  #   /auth/resources/         login-page + console static assets
  #   /auth/                   bare root (302s to /auth/admin/)
  # Everything else on this hostname still 404s at the tunnel.
  # SECURITY: the admin console is now reachable from the internet. It MUST sit
  # behind a Cloudflare Access app on this hostname (Google zdozisik@gmail.com
  # only), with a bypass/exclude policy for `^/auth/realms/engatwork/` so
  # oauth2-proxy's server-side token calls are not intercepted by Access.
  - hostname: keycloak.apps.mgmt-forge.engatwork.com
    path: '^/auth/((admin|realms/(engatwork|master))(/|$)|resources/|$)'
    service: https://10.10.5.201
  - hostname: keycloak.apps.mgmt-forge.engatwork.com
    service: http_status:404

# ESO wiring for templates/tunnel-externalsecret.yaml. vaultPath is relative
# to the KV v2 mount `kv` (ClusterSecretStore vault-forge, path: kv) — i.e.
# kv/data/forge/cloudflared/tunnel. Covered by the existing forge-reader
# policy (kv/data/forge/*), so no vault-config change is needed.
externalSecret:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-forge
    kind: ClusterSecretStore
  vaultPath: forge/cloudflared/tunnel
