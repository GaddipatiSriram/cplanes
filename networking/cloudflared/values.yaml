# Values for the mgmt-control cloudflared chart.
#
# Architecture (networking/cloudflared/README.md §2-3):
#   Browser --TLS--> Cloudflare edge --QUIC/HTTP2 (outbound-only)--> cloudflared
#           --HTTPS (caPool-validated)--> ingress-nginx VIP --> Service
#
#   - Locally-managed tunnel: this chart owns the ingress rules (below);
#     the Cloudflare dashboard only holds the proxied CNAMEs + Access apps.
#   - credentials.json is rendered by templates/tunnel-externalsecret.yaml
#     from Vault kv/data/forge/cloudflared/tunnel (ESO / ClusterSecretStore
#     vault-forge).
#   - WARP private-route (Tier-2: ArgoCD, Vault, Keycloak, Prometheus,
#     pfSense, oVirt, k8s API) is enabled here; the 10.10.0.0/16 route
#     itself is added in the Cloudflare dashboard (Networks > Routes).

tunnel:
  # Human-readable tunnel name (Cloudflare dashboard: Zero Trust > Networks
  # > Tunnels). Informational only — cloudflared routes by id.
  name: homelab

  # REQUIRED. The tunnel UUID. Not a secret — it is the public CNAME target
  # (<id>.cfargotunnel.com). Take it from the token: `echo <TOKEN> | base64 -d`
  # -> {"a":<account>,"t":<id>,"s":<secret>}; this is `t`. MUST match the
  # tunnel_id property stored in Vault (both come from the same decode).
  id: "37c41133-1280-4e52-9b54-5fce9b365d1e"

image:
  repository: cloudflare/cloudflared
  tag: "2026.8.2"
  pullPolicy: IfNotPresent

# Two replicas, anti-affinity across nodes — losing one node must not drop
# the tunnel. cloudflared holds 4 edge connections per replica.
replicas: 2

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi

# cloudflared metrics + /ready endpoint (readiness gate: 200 once >=1 edge
# connection is up).
metricsPort: 2000

# WARP private-network routing for Tier-2 (no public hostname). Enables the
# feature in cloudflared; the CIDR route is registered dashboard-side.
warpRouting:
  enabled: true

# Origin TLS trust anchor. cloudflared validates every origin cert against
# this CA (originRequest.caPool) — Full-strict on the last hop. Same PEM as
# security/secrets/external-secrets/values.yaml `vault.caBundle` and
