# cloudflared config.yaml (locally-managed tunnel) + the origin CA bundle.
#
# Ingress rules are rendered from .Values.ingress — the Cloudflare dashboard
# holds only the CNAMEs and Access apps, never the routing. `run` reads the
# tunnel id from the `tunnel:` key below; credentials.json is projected from
# Secret/cloudflared-tunnel (templates/tunnel-externalsecret.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared
  labels:
    app.kubernetes.io/name: cloudflared
    app.kubernetes.io/part-of: platform
data:
  config.yaml: |
    tunnel: {{ required "cloudflared: .Values.tunnel.id is required — create the tunnel, then set tunnel.id (the `t` field of `echo <TOKEN> | base64 -d`)" .Values.tunnel.id }}
    credentials-file: /etc/cloudflared/credentials.json
    metrics: 0.0.0.0:{{ .Values.metricsPort }}
    no-autoupdate: true
    {{- if .Values.warpRouting.enabled }}
    # warp-routing has no config keys in cloudflared 2026.8.x — an unknown
    # key here makes cloudflared reject the WHOLE config (503 everywhere).
    # Private-network routing is enabled by the registered teamnet route
    # (10.10.0.0/16). Block kept, empty, as an intent marker.
    warp-routing: {}
    {{- end }}
    # Global default — every origin cert is validated against the engatwork
    # Root CA. Overridable per-rule if a backend ever needs it.
    originRequest:
      caPool: /etc/cloudflared/engatwork-ca.crt
    # Rules match top-to-bottom, first hit wins. A rule may set `path` (regex)
    # to expose only part of a hostname — e.g. Keycloak's OIDC endpoints
    # without its /admin console. `http_status:*` pseudo-services need no
    # originRequest.
    ingress:
    {{- range .Values.ingress }}
      - hostname: {{ .hostname }}
        {{- if .path }}
        path: {{ .path | quote }}
        {{- end }}
        service: {{ .service }}
        {{- if not (hasPrefix "http_status:" .service) }}
        originRequest:
          # service is dialed by IP (the ingress-nginx VIP). originServerName
          # makes cloudflared send SNI = the hostname (so ingress-nginx picks
          # the right cert) AND validate that cert's SAN against the hostname
          # rather than the IP — the engatwork certs carry DNS SANs only.
          originServerName: {{ .hostname }}
          httpHostHeader: {{ .hostname }}
        {{- end }}
    {{- end }}
      # Catch-all — anything not matched above (including a stray CNAME) 404s
      # instead of leaking to a default backend.
      - service: http_status:404
  engatwork-ca.crt: |
{{ .Values.caBundle | indent 4 }}
