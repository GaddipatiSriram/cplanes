# ExternalSecret -> Secret/cloudflared-tunnel, holding a single file
# `credentials.json` in the shape cloudflared expects for a locally-managed
# tunnel:
#   { "AccountTag": ..., "TunnelID": ..., "TunnelSecret": ... }
#
# Source: Vault kv/data/forge/cloudflared/tunnel, three properties —
#   account_tag, tunnel_id, tunnel_secret
# Seed them from the dashboard tunnel token (one command, see README §4):
#   T=$(echo <TOKEN> | base64 -d)
#   vault kv put kv/forge/cloudflared/tunnel \
#     account_tag=$(jq -r .a <<<"$T") \
#     tunnel_id=$(jq -r .t <<<"$T") \
#     tunnel_secret=$(jq -r .s <<<"$T")
#
# Not named *-secret.yaml / *-creds.yaml — .gitignore would swallow it
# (repo memory feedback_gitignore_secrets).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cloudflared-tunnel
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name | quote }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind | quote }}
  target:
    name: cloudflared-tunnel
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      engineVersion: v2
      data:
        credentials.json: |
          {"AccountTag":"{{ `{{ .account_tag }}` }}","TunnelID":"{{ `{{ .tunnel_id }}` }}","TunnelSecret":"{{ `{{ .tunnel_secret }}` }}"}
  data:
    - secretKey: account_tag
      remoteRef:
        key: {{ .Values.externalSecret.vaultPath | quote }}
        property: account_tag
    - secretKey: tunnel_id
      remoteRef:
        key: {{ .Values.externalSecret.vaultPath | quote }}
        property: tunnel_id
    - secretKey: tunnel_secret
      remoteRef:
        key: {{ .Values.externalSecret.vaultPath | quote }}
        property: tunnel_secret
